# ─────────────────────────────────────────────────────────────────────────────
# events-finder — THE OPERATOR'S OWN TASTE MODEL
#
#   cp preferences.example.yaml preferences.yaml
#
# This file is *your* profile: the one the CLI uses (scripts/search.ts,
# scripts/prefs.ts --defaults) when there is no chat id to look up.
#
# New bot users do NOT inherit any of it. Someone who sends /start starts from
# an empty taste model and fills it in themselves, with buttons, through the
# walkthrough — inheriting a stranger's favourites would rank them against
# somebody else's taste. Only the home city and the currency are carried over,
# and the walkthrough asks for the city anyway.
#
# Each person's live preferences then live in the database under their own
# Telegram chat id. They change them with /setup, /settings, or by chatting
# ("add stand-up to favourites", "I'm in Lviv next week") — or you can:
#
#   npx tsx scripts/prefs.ts --chat <id> "add jazz to favourites"
#   npx tsx scripts/prefs.ts --list                 # who is registered
#   npx tsx scripts/prefs.ts --defaults "..."       # edit THIS file
# ─────────────────────────────────────────────────────────────────────────────

home_city: kharkiv

# Extra cities to watch for follow alerts.
watch_cities:
  - kyiv
  - lviv

# Categories you like. Known keys:
#   concert standup theatre exhibition lecture party festival workshop cinema kids sport
#   cafe bar gallery spot
# NOT copied to new users — the walkthrough asks them directly. This list is the
# operator's own taste, used by the CLI (scripts/search.ts) when no --chat is given.
favourite_categories:
  - standup
  - concert
  - exhibition

# Genres/scenes you do not want to see. Free text works too ("classical", "шансон").
disliked_categories:
  - classical
  - chanson

# Artists, comedians, bands, theatres. These are searched for by name
# (scripts/follows.ts --queries), beat every filter in the ranker, and trigger
# an immediate alert in any of that user's cities.
follow:
  - Курган і Agregat
  - Антон Тимошенко
  - Жадан і Собаки
  - Latexfauna

# Hard budget in UAH. Items whose cheapest ticket is above this are dropped
# (unless you follow the performer). Set to null for no limit.
max_ticket_price: 1200
currency: UAH

# Temporary location — set automatically by "I'm in Lviv next week".
# trip:
#   city: lviv
#   from: 2026-10-26
#   to: 2026-11-01
trip: null

# Genre likes — the event-side taste, as a CLOSED list: every entry must be a
# key of TAG_SYNONYMS in src/categories.ts (джаз, рок, інді, реп, електроніка,
# класика, фолк, поп, метал, при свічках, поезія, імпровізація …). Ranked above
# categories and matched anywhere in an event's text on purpose: "інді" must not
# borrow the concert keyword list and match every gig in town.
genres:
  - indie

# What a ❤️ or 🔖 on a *place* writes: free text, so a taste in cafés does not
# have to be a word we know. This is what the weekly place suggestions read.
place_likes:
  - speciality coffee
  - vinyl
  - contemporary art

notes: []

# Written by the bot, not by hand: the running tally for each tag. ❤️ adds a
# point, 👎 takes one away, which is what makes a category someone keeps
# hearting outrank one they hearted once. At -3 the category leaves
# favourite_categories and joins disliked_categories.
# taste:
#   standup: 7
#   concert: 2
#   classical: -3

# Also written by the bot: acts silenced by a 👎. Stronger than `follow` — a
# name here is never shown, even if its category is a favourite.
# blocked_acts:
#   - Якийсь гурт
